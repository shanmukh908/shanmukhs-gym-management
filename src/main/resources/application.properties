spring.application.name=gymapp
spring.config.import=optional:classpath:local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/gymdb
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:change-me}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.admin.username=admin
app.admin.password=${ADMIN_PASSWORD:Admin@123}

app.staff.username=staff
app.staff.password=${STAFF_PASSWORD:Staff@123}

app.gym.name=Shanmukh's Gym