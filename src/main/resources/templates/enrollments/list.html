<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enrollments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold mb-0">Enrollments</h2>
        <a th:href="@{/enrollments/new}" class="btn btn-primary">+ New Enrollment</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Member</th>
                    <th>Plan</th>
                    <th>Start</th>
                    <th>End</th>
                    <th>Paid</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${enrollments}">
                    <td class="fw-semibold" th:text="${e.member.fullName}">Member</td>
                    <td th:text="${e.plan.name}">Plan</td>
                    <td th:text="${#temporals.format(e.startDate, 'dd MMM yyyy')}">start</td>
                    <td th:text="${#temporals.format(e.endDate, 'dd MMM yyyy')}">end</td>
                    <td th:text="${'₹' + #numbers.formatDecimal(e.pricePaid, 1, 'COMMA', 2, 'POINT')}">₹0.00</td>
                    <td>
                        <span th:switch="${e.status.name()}">
                            <span th:case="'ACTIVE'" class="badge bg-success">Active</span>
                            <span th:case="'UPCOMING'" class="badge bg-info text-dark">Upcoming</span>
                            <span th:case="'EXPIRED'" class="badge bg-secondary">Expired</span>
                        </span>
                        <small th:if="${e.status.name() == 'ACTIVE'}"
                               th:text="${e.daysLeft} + ' days left'"
                               th:classappend="${e.daysLeft <= 7} ? 'text-danger fw-semibold' : 'text-muted'"
                               class="d-block">
                        </small>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(enrollments)}">
                    <td colspan="6" class="text-center text-muted py-4">
                        No enrollments yet. Click "+ New Enrollment" to sell your first membership.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
