<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Enrollment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <h2 class="fw-bold mb-3">New Enrollment</h2>

            <div th:if="${#lists.isEmpty(plans)}" class="alert alert-warning">
                There are no active plans. Activate or create a plan first.
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <form th:action="@{/enrollments}" th:object="${enrollmentForm}" method="post">

                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                            <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="memberId">Member</label>
                            <select id="memberId" th:field="*{memberId}" class="form-select"
                                    th:classappend="${#fields.hasErrors('memberId')} ? 'is-invalid'">
                                <option value="">-- Select member --</option>
                                <option th:each="m : ${members}" th:value="${m.id}"
                                        th:text="${m.fullName + ' (' + m.email + ')'}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{memberId}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="planId">Plan</label>
                            <select id="planId" th:field="*{planId}" class="form-select"
                                    th:classappend="${#fields.hasErrors('planId')} ? 'is-invalid'">
                                <option value="">-- Select plan --</option>
                                <option th:each="p : ${plans}" th:value="${p.id}"
                                        th:text="${p.name + ' - ' + p.durationInMonths + (p.durationInMonths == 1 ? ' month' : ' months') + ' - ₹' + p.price}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{planId}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="startDate">Start date</label>
                            <input type="date" id="startDate" th:field="*{startDate}" class="form-control"
                                   th:classappend="${#fields.hasErrors('startDate')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{startDate}"></div>
                            <div class="form-text">The end date is calculated automatically from the plan duration.</div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Enroll Member</button>
                            <a th:href="@{/enrollments}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
