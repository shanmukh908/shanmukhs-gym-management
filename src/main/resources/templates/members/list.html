<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Members</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold mb-0">Members</h2>
        <a th:href="@{/members/new}" class="btn btn-primary">+ Add Member</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:action="@{/members}" method="get" class="row g-2 mb-3">
        <div class="col-md-6">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control"
                   placeholder="Search by name or email">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">Search</button>
            <a th:href="@{/members}" class="btn btn-outline-secondary">Clear</a>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Gender</th>
                    <th>Joined</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${members}">
                    <td class="fw-semibold" th:text="${m.fullName}">Name</td>
                    <td th:text="${m.email}">email</td>
                    <td th:text="${m.phone}">phone</td>
                    <td th:text="${m.gender}">gender</td>
                    <td th:text="${m.joinDate}">date</td>
                    <td class="text-end">
                        <a th:href="@{/enrollments/new(memberId=${m.id})}" class="btn btn-sm btn-success">Enroll</a>
                        <a th:href="@{/members/{id}/edit(id=${m.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                        <form th:if="${isAdmin}" th:action="@{/members/{id}/delete(id=${m.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Delete this member? This cannot be undone.');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(members)}">
                    <td colspan="6" class="text-center text-muted py-4">
                        No members found.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
