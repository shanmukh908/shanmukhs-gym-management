<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Member</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <h2 class="fw-bold mb-3" th:text="${memberId == null} ? 'Add Member' : 'Edit Member'">Member</h2>

            <div class="card shadow-sm">
                <div class="card-body">
                    <form th:action="${memberId == null} ? @{/members} : @{/members/{id}(id=${memberId})}"
                          th:object="${memberForm}" method="post">

                        <div class="mb-3">
                            <label class="form-label" for="fullName">Full name</label>
                            <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{fullName}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="email">Email</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="phone">Phone</label>
                            <input type="text" id="phone" th:field="*{phone}" class="form-control"
                                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                                   placeholder="10-digit mobile number">
                            <div class="invalid-feedback" th:errors="*{phone}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="gender">Gender</label>
                                <select id="gender" th:field="*{gender}" class="form-select"
                                        th:classappend="${#fields.hasErrors('gender')} ? 'is-invalid'">
                                    <option value="">-- Select --</option>
                                    <option th:each="g : ${genders}" th:value="${g}" th:text="${g}"></option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{gender}"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="dateOfBirth">Date of birth (optional)</label>
                                <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}" class="form-control"
                                       th:classappend="${#fields.hasErrors('dateOfBirth')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{dateOfBirth}"></div>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Save Member</button>
                            <a th:href="@{/members}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
