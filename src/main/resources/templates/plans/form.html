<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Plan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <h2 class="fw-bold mb-3">Add Membership Plan</h2>

            <div class="card shadow-sm">
                <div class="card-body">
                    <form th:action="@{/plans}" th:object="${planForm}" method="post">

                        <div class="mb-3">
                            <label class="form-label" for="name">Plan name</label>
                            <input type="text" id="name" th:field="*{name}" class="form-control"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                   placeholder="e.g. Monthly">
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="durationInMonths">Duration (months)</label>
                            <input type="number" id="durationInMonths" th:field="*{durationInMonths}" class="form-control"
                                   th:classappend="${#fields.hasErrors('durationInMonths')} ? 'is-invalid'"
                                   placeholder="e.g. 1">
                            <div class="invalid-feedback" th:errors="*{durationInMonths}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="price">Price (₹)</label>
                            <input type="number" step="0.01" id="price" th:field="*{price}" class="form-control"
                                   th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"
                                   placeholder="e.g. 999">
                            <div class="invalid-feedback" th:errors="*{price}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="description">Description (optional)</label>
                            <textarea id="description" th:field="*{description}" class="form-control"
                                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                      rows="3" placeholder="What does this plan include?"></textarea>
                            <div class="invalid-feedback" th:errors="*{description}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Save Plan</button>
                            <a th:href="@{/plans}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
