<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Membership Plans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold mb-0">Membership Plans</h2>
        <a th:href="@{/plans/new}" class="btn btn-primary">+ Add Plan</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Name</th>
                    <th>Duration</th>
                    <th>Price</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="plan : ${plans}">
                    <td class="fw-semibold" th:text="${plan.name}">Monthly</td>
                    <td th:text="${plan.durationInMonths + (plan.durationInMonths == 1 ? ' month' : ' months')}">1 month</td>
                    <td th:text="${'₹' + #numbers.formatDecimal(plan.price, 1, 'COMMA', 2, 'POINT')}">₹999.00</td>
                    <td th:text="${plan.description}">Description</td>
                    <td>
                        <span th:if="${plan.active}" class="badge bg-success">Active</span>
                        <span th:unless="${plan.active}" class="badge bg-secondary">Inactive</span>
                    </td>
                    <td class="text-end">
                        <form th:action="@{/plans/{id}/toggle(id=${plan.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm"
                                    th:classappend="${plan.active} ? 'btn-outline-secondary' : 'btn-outline-success'"
                                    th:text="${plan.active} ? 'Deactivate' : 'Activate'">Toggle</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(plans)}">
                    <td colspan="6" class="text-center text-muted py-4">
                        No plans yet. Click "+ Add Plan" to create your first one.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
